# Checks every pull request and every merge to main. It only deploys to AWS when run by hand (Actions → CI/CD →
# Run workflow, on main), and then only if the checks pass. The check job's name is a required status check in
# main's branch protection, so keep it as is.
#
# The deploy runs in the `production` environment (Settings → Environments), which holds:
#   vars.AWS_DEPLOY_ROLE_ARN  role from the NextTrainGitHubDeploy stack (no AWS keys are stored in GitHub)
#   vars.DOMAIN_NAME          custom domain, e.g. nexttrain.ie
#   secrets.BUDGET_EMAIL      where budget alerts and help-page feedback are emailed
# The deploy role only trusts jobs in that environment, and the environment only allows the main branch.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's older checks; runs on main each get their own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, typecheck, build, synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # matches the Lambda runtime
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      # Synth without AWS credentials catches infra mistakes on pull requests too.
      - run: npx cdk synth --quiet
        working-directory: packages/infra

  deploy:
    name: Deploy to AWS
    needs: check
    # Only on request: merges to main are checked but not deployed.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.site_url }}
    # One deploy at a time. A newer one waits for a running one to finish (it isn't interrupted); if several pile
    # up, GitHub keeps only the newest waiting one, which includes everything before it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for the token AWS trusts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - run: npm ci
      - id: deploy
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
        run: |
          npm run deploy -- --require-approval never --outputs-file "$RUNNER_TEMP/outputs.json" \
            -c "domainName=$DOMAIN_NAME" -c "budgetEmail=$BUDGET_EMAIL"
          echo "site_url=$(jq -r '.DartTimes.SiteUrl' "$RUNNER_TEMP/outputs.json")" >> "$GITHUB_OUTPUT"
      # CloudFormation finishing doesn't mean the site works: check it from outside, as a phone would (the new
      # commit is served, the API answers, today's timetable file exists, www redirects). Fails the run if not.
      - name: Check the live site
        run: packages/infra/scripts/verify-deploy.sh "${{ steps.deploy.outputs.site_url }}" "$GITHUB_SHA"
