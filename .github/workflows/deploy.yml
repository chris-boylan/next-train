# Deploys main to AWS, only when you run it: Actions → "Deploy to AWS" → Run workflow.
#
# Runs in the `production` environment (Settings → Environments), which holds:
#   vars.AWS_DEPLOY_ROLE_ARN  role from the NextTrainGitHubDeploy stack (no AWS keys are stored in GitHub)
#   vars.DOMAIN_NAME          custom domain, e.g. nexttrain.ie
#   secrets.BUDGET_EMAIL      where budget alerts and help-page feedback are emailed
# The deploy role only trusts jobs in that environment, and the environment only allows the main branch.
name: Deploy to AWS

on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a second one waits for the first to finish rather than interrupting it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Test, typecheck, build, synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx cdk synth --quiet
        working-directory: packages/infra

  deploy:
    name: Deploy to AWS
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.site_url }}
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for the token AWS trusts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - run: npm ci
      - id: deploy
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
        run: |
          npm run deploy -- --require-approval never --outputs-file "$RUNNER_TEMP/outputs.json" \
            -c "domainName=$DOMAIN_NAME" -c "budgetEmail=$BUDGET_EMAIL"
          echo "site_url=$(jq -r '.DartTimes.SiteUrl' "$RUNNER_TEMP/outputs.json")" >> "$GITHUB_OUTPUT"
